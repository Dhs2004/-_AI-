<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星潮纪行 · 渲染实验室</title><link rel="stylesheet" href="../dist/style.css"><style>body{padding:24px}main{max-width:1200px;margin:auto}h1{font:28px var(--serif);margin-bottom:8px}p{color:var(--muted);margin-bottom:18px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.controls button,.controls select{padding:10px;background:#25434d;border:1px solid var(--line);color:var(--ink);border-radius:7px}canvas{display:block;width:100%;height:600px;border:1px solid #527073;border-radius:10px}output{display:block;margin:15px 0;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:650px){body{padding:12px}canvas{height:520px}h1{font-size:23px}}</style></head><body><main>
<h1>星潮纪行 · 渲染实验室</h1><p>使用真实游戏渲染器；此页面不读取、不修改游戏存档。帧率来自 requestAnimationFrame 实测。</p>
<div class="controls"><label>场景 <select id="scenario"></select></label><label>画质 <select id="quality"><option value="2">精细 · DPR 上限 2</option><option value="1.5">均衡</option><option value="1">流畅</option></select></label><button id="suite">测试全部场景</button><button id="outdoors">测试户外分区</button><button id="battles">测试九种战斗特效</button><button id="coastal">测试新伙伴十二形态</button><button id="stop">停止轮测</button></div>
<canvas id="screen" aria-label="渲染测试画面"></canvas><output id="live">准备渲染</output><output id="cache"></output><table><thead><tr><th>场景</th><th>画布</th><th>FPS</th><th>P95 帧间隔</th><th>平均绘制</th></tr></thead><tbody id="results"></tbody></table>
</main><script type="module" src="performance.js"></script></body></html>
