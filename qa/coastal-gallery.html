<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四位新伙伴 · 像素成长图鉴</title><style>body{background:#102631;color:#ead8ae;font:14px system-ui;margin:35px}h1{font:30px Georgia,serif}section{margin-bottom:32px}h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:14px}.card{padding:16px;border:1px solid #b0c49d33;border-radius:12px;background:#1c3540;text-align:center}.card p{color:#94b5aa;font-size:11px}canvas{width:140px;height:140px;image-rendering:pixelated;max-width:100%}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}body{margin:18px}}</style><h1>四位新伙伴 · 成长与战斗背面</h1><p>雪原、浅湾、棱砂与钟庭，各自有一种同行的办法。</p><main id="gallery"></main><script type="module">import{SPECIES}from'../dist/js/data.js';import{drawMonster}from'../dist/js/art.js';const root=document.querySelector('#gallery');for(const family of ['frostotter','kitesquid','glassbeetle','clockmouse']){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=SPECIES[family].name+'家族';section.append(title);const grid=document.createElement('div');grid.className='grid';for(const back of [false,true])for(let stage=1;stage<=3;stage++){const s=SPECIES[family+(stage>1?'_'+stage:'')],card=document.createElement('div'),c=document.createElement('canvas'),name=document.createElement('strong'),detail=document.createElement('p');card.className='card';c.width=c.height=280;name.textContent=s.name;detail.textContent='第 '+stage+' 阶 · '+(back?'背面':'正面');card.append(c,name,detail);grid.append(card);drawMonster(c.getContext('2d'),s,0,0,280,{time:2,back});}section.append(grid);root.append(section);}</script></html>
