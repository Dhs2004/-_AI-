<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101f29"><meta name="description" content="星潮纪行：在被星海遗忘的群岛，与你的潮灵伙伴一起找回世界的记忆。原创探索与回合制对战 RPG。"><title>星潮纪行 · Starfall Chronicle</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23152735'/%3E%3Cpath d='M32 7 38 25 57 32 38 39 32 57 25 39 7 32 25 25Z' fill='%23e8c784'/%3E%3C/svg%3E"></head>
<body>
 <main id="app">
  <header class="masthead"><a class="wordmark" href="#" id="home-mark"><span class="brand-star">✧</span><span>星潮纪行<small>STARFALL CHRONICLE</small></span></a><div class="header-right"><span class="version">原创群岛冒险 RPG · 开发中</span><button class="icon-button" id="sound-button" aria-label="切换声音" title="声音">♫</button><button class="icon-button" id="help-button" aria-label="操作说明" title="操作说明">?</button><button class="icon-button" id="settings-button" aria-label="设置与存档" title="设置与存档">⚙</button></div></header>
  <section id="stage" aria-label="游戏区域">
   <canvas id="world" width="1200" height="760" tabindex="0" aria-label="游戏地图：使用方向键或 WASD 移动，E 或空格互动"></canvas>
   <div id="world-ui" class="hidden"><div class="location-box"><span class="eyebrow" id="chapter-label"></span><h1 id="place-name"></h1><div class="location-meta"><span id="weather-label"></span><span class="dot"></span><span id="region-label"></span></div></div><div class="quest-pin" id="quest-pin"></div><div class="wallet"><span>◈</span><b id="gold-label">550</b><span class="wallet-divider"></span><span id="badge-label">✧ 0 / 8</span></div><button class="interact-prompt hidden" id="interact-prompt" aria-label="与附近目标互动"></button><div id="zone-toast" class="zone-toast hidden"></div><div class="world-bottom"><div id="party-dock" class="party-dock"></div><div class="world-tools"><button id="local-chart-shortcut" class="local-chart-shortcut" aria-label="打开随身航图"><span>⌖</span><b>随身航图</b><small>K</small></button><button id="journal-shortcut" class="journal-shortcut"><span>▤</span>旅途手记<small>J</small></button></div></div></div>
   <div id="title-screen" class="title-screen"><div class="title-content"><div class="eyebrow title-eyebrow">一封寄给所有未归之人的信</div><div class="title-ornament">✧ ───── ✦ ───── ✧</div><h1>星潮<span>纪行</span></h1><p class="english-title">STARFALL CHRONICLE</p><p class="title-description">当群星坠入海里，记忆便有了形状。<br>带上你的潮灵，去寻找世界最后的八盏灯。</p><div class="title-actions"><button id="continue-button" class="primary hidden">继续旅程 <span>→</span></button><button id="new-button" class="primary">启程，去往群星之海 <span>→</span></button><button id="import-title" class="text-button">导入旅途存档</button></div><div class="title-details"><span>自由探索</span><i>·</i><span>潮灵缔约</span><i>·</i><span>策略对战</span><i>·</i><span>八岛长旅</span></div></div><div class="title-caption"><span class="tiny-star">✦</span>眠潮岛 · 灯穗港<small>我们的故事，从一盏尚未熄灭的灯开始。</small></div></div>
   <div id="battle-screen" class="battle-screen hidden"><div class="battle-top"><span id="battle-location"></span><span id="battle-weather"></span><div class="battle-tools"><button id="battle-speed" class="battle-speed" aria-label="战斗演出速度">1×</button><button class="text-button" id="battle-help">说明</button></div></div><button id="enemy-intent" class="enemy-intent" aria-label="查看对方行动意图"></button><div class="battle-status enemy-status" id="enemy-status"></div><div class="battle-status player-status" id="player-status"></div><div class="battle-dialog"><div class="battle-narration"><div class="battle-log-heading"><span class="eyebrow" id="turn-label">相遇</span><div class="battle-reading-tools"><button id="battle-move-help" class="text-button">招式说明</button><button id="battle-record" class="text-button">战况回顾</button></div></div><div id="battle-log" role="log" aria-live="polite"></div></div><div class="battle-actions" id="battle-actions"></div></div></div>
   <div id="dialogue" class="dialogue hidden" role="dialog" aria-modal="true" aria-label="剧情对话"><div class="portrait"><canvas id="portrait-canvas" width="96" height="96"></canvas></div><div class="dialogue-main"><span id="speaker"></span><p id="dialogue-text"></p></div><button id="dialogue-next" class="dialogue-next" aria-label="继续对话">继续 <kbd>E</kbd><span>▼</span></button></div>
   <div class="mobile-controls hidden" id="mobile-controls"><div class="dpad"><button data-dir="up" aria-label="向上">▲</button><button data-dir="left" aria-label="向左">◀</button><button data-dir="down" aria-label="向下">▼</button><button data-dir="right" aria-label="向右">▶</button></div><button id="touch-interact">互动</button></div>
  </section>
  <nav id="game-nav" class="game-nav hidden" aria-label="游戏菜单"><button data-menu="party"><span>♧</span>潮灵队伍<kbd>P</kbd></button><button data-menu="bag"><span>♙</span>旅行背包<kbd>B</kbd></button><button data-menu="map"><span>⌘</span>群岛地图<kbd>M</kbd></button><button data-menu="journal"><span>▤</span>旅途手记<kbd>J</kbd></button><button data-menu="dex"><span>✧</span>潮灵图鉴<kbd>L</kbd></button><div class="save-indicator" id="save-indicator">本机自动存档</div></nav>
  <footer><span>把昨天交还给海，把明天留给自己。</span><span id="perf-indicator" title="实际渲染帧率">测量帧率中</span><span id="footer-hint"><kbd>WASD</kbd> / 方向键移动 <kbd>E</kbd> 互动 <kbd>Shift</kbd> 奔跑</span></footer>
 </main>
 <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="游戏菜单"><section class="modal-panel"><div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">旅途的一部分</span><h2 id="modal-title"></h2></div><button id="modal-close" class="icon-button" aria-label="关闭">×</button></div><div id="modal-content"></div></section></div>
 <div id="toast" class="toast hidden" role="status"></div><input type="file" id="save-file" accept=".json,application/json" hidden>
 <script type="module" src="js/game.js"></script>
</body></html>
